<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cricket Auction Gauntlet - Live Progress</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(18, 24, 38, 0.8);
      --accent-gold: #f59e0b;
      --accent-neon: #10b981;
      --accent-red: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 1rem;
    }
    h1 {
      margin: 0;
      background: linear-gradient(135deg, #f59e0b, #10b981);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 2rem;
    }
    .badge {
      background: rgba(16, 185, 129, 0.25);
      color: var(--accent-neon);
      border: 1px solid var(--accent-neon);
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      font-weight: bold;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 1rem;
      padding: 1.5rem;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(16, 185, 129, 0.5);
    }
    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-tag {
      font-size: 0.75rem;
      padding: 0.25rem 0.5rem;
      border-radius: 0.25rem;
      text-transform: uppercase;
      font-weight: bold;
    }
    .status-won { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
    .status-in_progress { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .gap-box {
      margin-top: 1rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      background: rgba(0,0,0,0.4);
      padding: 0.75rem;
      border-radius: 0.5rem;
      border-left: 3px solid var(--accent-neon);
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>Tinder x Cricket Auction Platform</h1>
      <p style="color: var(--text-muted); margin: 0.25rem 0 0 0;">Gauntlet Refinement &amp; Verification Complete</p>
    </div>
    <div id="summary-badge" class="badge">9 / 9 Components Won 🎉</div>
  </div>

  <div id="grid" class="grid"></div>

  <script>
    async function loadProgress() {
      try {
        const res = await fetch('./progress.json?t=' + Date.now());
        const data = await res.json();
        
        const summaryBadge = document.getElementById('summary-badge');
        summaryBadge.textContent = `${data.wonPieces} / ${data.totalPieces} Components Won 🎉`;

        const grid = document.getElementById('grid');
        grid.innerHTML = data.pieces.map(piece => `
          <div class="card">
            <div class="card-title">
              <span>${piece.name}</span>
              <span class="status-tag status-${piece.status}">${piece.status.replace('_', ' ')}</span>
            </div>
            <div style="font-size: 0.85rem; color: #10b981; font-weight: bold;">Round ${piece.round} · ${piece.verdict}</div>
            <div class="gap-box">
              <strong>Refinement Notes:</strong><br>
              ${piece.gap}
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error('Error loading progress:', err);
      }
    }
    loadProgress();
  </script>
</body>
</html>
